<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>水织</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #2A3440;
    overflow: hidden;
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* 开发期调试壳：画布居中，尺寸跟着视口走 */
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #board {
    width: min(92vmin, 720px);
    height: min(92vmin, 720px);
    display: block;
    touch-action: none;
    cursor: crosshair;
  }

  /* 一纸注记（M3 为占位卡片，M5 出最终版式） */
  #notecard {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(14, 22, 30, 0.78);
    cursor: pointer;
  }
  #notecard.show { display: grid; }
  #notecard .card {
    width: min(86vw, 420px);
    padding: 30px 30px 22px;
    border: 1px solid rgba(237, 230, 214, 0.18);
    background: #16202B;
  }
  #notecard h2 {
    margin: 0 0 16px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: #EDE6D6;
  }
  #notecard p {
    margin: 0 0 12px;
    font-size: 15px;
    line-height: 1.95;
    color: rgba(237, 230, 214, 0.82);
  }
  #notecard .hint {
    margin: 18px 0 0;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-align: right;
    color: rgba(237, 230, 214, 0.4);
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="board"></canvas></div>

  <div id="notecard" role="dialog" aria-modal="true">
    <div class="card">
      <h2 id="notecard-title"></h2>
      <div id="notecard-body"></div>
      <p class="hint">轻点继续</p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
